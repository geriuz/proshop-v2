name: Build y despliegue en Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-proshop
  APP_NAME: proshop-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir nombre de imagen
        run: echo "IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/proshop" >> $GITHUB_ENV

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar nueva revisión
        run: |
          az extension add --name containerapp --upgrade -y
          az containerapp update \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $IMAGE:${{ github.sha }}
